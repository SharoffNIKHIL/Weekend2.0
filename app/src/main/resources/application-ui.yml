# app/src/main/resources/application-ui.yml — UI preview env: `mvn spring-boot:run -Dspring-boot.run.profiles=local,ui`
# Loopback only, offline model, no session, made-up demo data (UiPreviewSeeder). Never use on Cloud Run.
server:
  address: 127.0.0.1
  port: ${PORT:8081}
weekend:
  llm:
    provider: local
  security:
    require-session: false
  studio:
    tts:
      provider: ${WEEKEND_TTS:say}                   # preview: macOS draft voice (not for monetised uploads)
owner-profile-file: ${user.home}/.weekend/owner-profile.md      # your facts → pinned memories (private, local)
owner-brand-dir: ${user.home}/.weekend/brand                    # your private brand pack (served at /brand/)
studio-media-dir: ${user.home}/.weekend/studio                  # rendered videos (private, local)
