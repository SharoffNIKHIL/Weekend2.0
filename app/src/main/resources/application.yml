# app/src/main/resources/application.yml — defaults; Cloud Run overrides via environment variables.
server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: weekend-assistant
  main:
    banner-mode: "off"

weekend:
  owner-timezone: Asia/Kolkata
  llm:
    provider: ${WEEKEND_LLM_PROVIDER:local}          # local (offline) | vertex (Claude on Vertex AI)
    gcp-project: ${GCP_PROJECT:}
    vertex-location: ${VERTEX_LOCATION:global}       # "global" = 🔓 may leave India (DESIGN §7.4)
    model-default: ${MODEL_DEFAULT:claude-haiku-4-5@20251001}
    model-strong: ${MODEL_STRONG:claude-sonnet-5}
    max-output-tokens: 4096                          # ceiling; each agent's efficiency level picks 512–4096
    default-input-price: 1.00                        # USD per million tokens (Haiku 4.5)
    default-output-price: 5.00
    strong-input-price: 2.00                         # Sonnet 5 (confirm on Vertex pricing, I-19/R-1)
    strong-output-price: 10.00
  agent:
    max-tool-steps: 10                               # ceiling; efficiency picks 2–10
    max-memories-in-context: 8
    max-history-turns: 20
    strong-model-min-chars: 1200
    daily-cost-cap-usd: 0.62                         # ≈ ₹60/day (DESIGN §21.5)
  retention:                                         # P5 (DESIGN §9.4)
    messages: 365d
    unpinned-memories: 180d
    tool-calls: 90d
    audit-log: 730d
    notifications: 30d
    inbox-messages: 365d
  notion:                                            # Notion connector (🔓 P7) — off until a token is set
    token: ${WEEKEND_NOTION_TOKEN:}                  # Notion internal integration secret; Secret Manager / env only
    base-url: https://api.notion.com
    version: "2022-06-28"
    parent-page-id: ${WEEKEND_NOTION_PARENT_PAGE:}   # page that new notes go under
    timeout: 15s
  pressure:                                          # high-pressure handling
    max-concurrent-chats: ${WEEKEND_MAX_CONCURRENT_CHATS:4}
    queue-wait: 10s
    llm-retries: 2
    retry-backoff: 400ms
  web:                                               # agent web search (🔓 P7) — off until a host is allowed
    allowed-hosts: ${WEEKEND_WEB_ALLOWED_HOSTS:}     # e.g. en.wikipedia.org — security checkpoint first
    search-base-url: https://en.wikipedia.org
    timeout: 10s
  owner:                                             # private local files, never committed
    profile-file: ${WEEKEND_OWNER_PROFILE:${owner-profile-file:}}
    brand-dir: ${WEEKEND_BRAND_DIR:${owner-brand-dir:}}
  studio:                                            # Weekend Studio — YouTube video creation
    media-dir: ${WEEKEND_STUDIO_MEDIA:${studio-media-dir:}}   # rendered videos (private); default: system temp
    ffmpeg: ${WEEKEND_FFMPEG:ffmpeg}
    fps: 30
    scale: 1.0
    render-threads: 2
    retention: 30d                                   # P5: rendered videos are deleted after 30 days
    web-searches: ${WEEKEND_STUDIO_WEB_SEARCHES:0}    # Claude web searches per research step (🔓, paid) — 0 = off until approved
    music: true                                      # quiet background pad generated in-app (royalty-free)
    tts:
      provider: ${WEEKEND_TTS:none}                  # none | google (Cloud TTS, security checkpoint) | say (macOS drafts only)
      voice: en-IN-Neural2-B
      language-code: en-IN
      speaking-rate: 1.0
  security:
    session-key: ${WEEKEND_SESSION_KEY:}             # from Secret Manager; never committed
    session-ttl: 12h
    require-session: ${WEEKEND_REQUIRE_SESSION:true} # fail closed

logging:
  level:
    root: INFO
    com.weekend: ${LOG_LEVEL:INFO}
