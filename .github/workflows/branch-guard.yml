# .github/workflows/branch-guard.yml — enforces docs/BRANCHING.md v1.4 (no cloud credentials used)
#   - feature_*/Feature_* → dev only; release and prod accept PRs only from main or promote/* branches
#   - env values: infra/values/<env>*.tfvars may exist ONLY on the matching env branch
#     (dev → dev*.tfvars, prod → prod*.tfvars); main and release hold templates (*.example) only
#   - identifying values (secrets.auto.tfvars, terraform.tfvars, backend.hcl) are never committed
name: branch-guard

on:
  pull_request:
    branches: [main, dev, prod, release]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Branch rules
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "PR: ${HEAD} -> ${BASE}"
          shopt -s nocasematch   # feature_infra, Feature_code, …
          if [[ "$HEAD" == feature_* && "$BASE" != "dev" ]]; then
            echo "::error::Feature branches merge into dev only."; exit 1
          fi
          if [[ "$BASE" == release || "$BASE" == prod ]] && [[ "$HEAD" != main && "$HEAD" != promote/* ]]; then
            echo "::error::${BASE} only accepts PRs from main or promote/* (infra/scripts/promote.py)."; exit 1
          fi

      - name: Env values only on their own branch
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          values=$(git ls-files 'infra/values/*.tfvars' | grep -v '\.example$' || true)
          case "$BASE" in
            dev|prod) bad=$(printf '%s\n' "$values" | grep -v -E "^infra/values/${BASE}(\.bootstrap)?\.tfvars$" | grep . || true) ;;
            *)        bad=$values ;;
          esac
          leaked=$(git ls-files | grep -E '(^|/)(secrets\.auto\.tfvars|terraform\.tfvars|backend\.hcl)$|\.tfplan$|credentials/' || true)
          if [ -n "$bad$leaked" ]; then
            echo "::error::Not allowed on ${BASE}: ${bad} ${leaked} (docs/BRANCHING.md)"; exit 1
          fi
          echo "Values OK for ${BASE}: ${values:-templates only}"
