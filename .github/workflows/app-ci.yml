# .github/workflows/app-ci.yml — Application CI: test (JUnit, 40+) → package → Docker image build (no push)
# on every PR that touches app/. Deployment is app-cd.yml.
name: app-ci

on:
  pull_request:
    branches: [dev, main, release, prod]
    paths: ["app/**", ".github/workflows/app-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: app/target/surefire-reports

  image:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the container image (proves the Dockerfile; not pushed)
        run: docker build --pull -t weekend-assistant:ci app/
