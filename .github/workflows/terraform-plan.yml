# .github/workflows/terraform-plan.yml
# Plans infra/envs/dev for PRs into `dev` (feature_* → dev) and posts the masked plan as a PR comment.
# Dev values come ONLY from the `dev` environment's secrets, never from the code:
#   TFVARS             non-sensitive dev values (HCL, same keys as infra/envs/dev/terraform.tfvars.example)
#   AWS_ACCOUNT_ID     12-digit account ID
#   ALERT_EMAIL        budget alert e-mail
#   AURORA_ENGINE_VERSION  Aurora PostgreSQL version (T-018)
#   AWS_PLAN_ROLE_ARN  read-only role GitHub assumes via OIDC (infra/bootstrap/github_oidc.tf)
# Never applies. Fork PRs get no secrets or OIDC token, so they skip.
name: terraform-plan

on:
  pull_request:
    branches: [dev]
    paths: ["infra/**", ".github/workflows/terraform-plan.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC to AWS; no long-lived keys
  pull-requests: write # post the plan comment

concurrency:
  group: terraform-plan-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan-dev:
    runs-on: ubuntu-latest
    environment: dev
    env:
      HAS_ROLE: ${{ secrets.AWS_PLAN_ROLE_ARN != '' }}
    steps:
      - name: Skip when AWS access is not configured yet
        if: env.HAS_ROLE != 'true'
        run: echo "::notice::dev environment secret AWS_PLAN_ROLE_ARN is not set; skipping plan (see docs/BRANCHING.md)."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_ROLE == 'true'

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: env.HAS_ROLE == 'true'
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: env.HAS_ROLE == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: weekend2-dev-plan

      - name: Write terraform.tfvars from secrets (runner only, never committed)
        if: env.HAS_ROLE == 'true'
        env:
          TFVARS: ${{ secrets.TFVARS }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          AURORA_ENGINE_VERSION: ${{ secrets.AURORA_ENGINE_VERSION }}
        run: |
          set -euo pipefail
          umask 077
          {
            printf '%s\n' "$TFVARS"
            printf 'aws_account_id = "%s"\n' "$AWS_ACCOUNT_ID"
            printf 'alert_email    = "%s"\n' "$ALERT_EMAIL"
            printf 'aurora_engine_version = "%s"\n' "$AURORA_ENGINE_VERSION"
          } > infra/envs/dev/terraform.tfvars

      - name: terraform plan (local throwaway state until bootstrap is applied)
        if: env.HAS_ROLE == 'true'
        run: python3 infra/scripts/plan_env.py --env dev --local-state --out plan.md

      - name: Post plan to the PR
        if: env.HAS_ROLE == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # GitHub comments are limited to 65,536 characters
          head -c 60000 plan.md > comment.md
          gh pr comment "$PR" --body-file comment.md

      - name: Remove tfvars
        if: always()
        run: rm -f infra/envs/dev/terraform.tfvars
